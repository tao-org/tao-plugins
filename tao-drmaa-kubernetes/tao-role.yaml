apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tao-sa-role
  namespace: argo
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "pods/log" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]