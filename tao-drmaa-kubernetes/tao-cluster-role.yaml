apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tao-sa-cluster-role
rules:
  - apiGroups: [ "metrics.k8s.io" ]
    resources: [ "nodes" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "nodes", "pods", "pods/log" ]
    verbs: [ "get", "list", "watch" ]

