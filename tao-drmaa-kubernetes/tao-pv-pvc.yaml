# Config for mounts with source like: "/D/mnt/tao/..." 
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tao-pv  
spec:
  storageClassName: local-path
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/mnt/d/mnt/tao"
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tao-pvc
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  volumeName: tao-pv   
---
