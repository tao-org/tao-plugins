#cloud-config

system_info:
  default_user:
    name: openstack
    gecos: Openstack default cloud user
    groups: wheel,adm,systemd-journal
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_pwauth: True
    lock_passwd: False
    ssh_authorized_keys:
      - ssh-rsa  Generated-by-Nova

users:
  - default
  - name: sen2agri
    gecos: Sen2agri cloud user
    groups: wheel,adm,systemd-journal
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_pwauth: True
    lock_passwd: False
    ssh_authorized_keys:
      - ssh-rsa  Generated-by-Nova

chpasswd:
  list: |
    root:root
    openstack:openstack
    sen2agri:sen2agri
  expire: False

runcmd:
  - sed -i -e '/^[# ]*PermitRootLogin/s/^.*$//' /etc/ssh/sshd_config
  - sed -i -e '/^[# ]*PasswordAuthentication/s/^.*$//' /etc/ssh/sshd_config
  - sed -i -e '/^[# ]*PermitEmptyPasswords/s/^.*$//' /etc/ssh/sshd_config
  - sed -i -e '$aPermitRootLogin no' /etc/ssh/sshd_config
  - sed -i -e '$aPasswordAuthentication yes' /etc/ssh/sshd_config
  - sed -i -e '$aPermitEmptyPasswords no' /etc/ssh/sshd_config
  - systemctl restart sshd